[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concert-remaster"
version = "0.3.0"
description = "Turn live concert recordings into clean, studio-style masters with on-device AI stem separation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.13",
    "soxr>=0.3",
    # librosa 1.0 dropped audioread and changed its audio API; the separation models
    # (audio-separator) are built on 0.10/0.11 and import audioread themselves.
    "librosa>=0.10,<1.0",
    "audioread>=3.0",
    "pedalboard>=0.9",
    "pyloudnorm>=0.1.1",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# AI separation models (Roformer, MDX-Net, Demucs) run locally through audio-separator.
# Pick the CPU or GPU build; GPU gives 5-20x faster separation.
cpu = ["audio-separator[cpu]>=0.40"]
# onnxruntime-gpu 1.27+ is built for CUDA 13; PyTorch's CUDA 12.6 build ships CUDA 12 libraries.
gpu = ["audio-separator[gpu]>=0.40", "onnxruntime-gpu>=1.20,<1.27"]
dml = ["audio-separator[dml]>=0.40"]
# The desktop app: its window (WebView2 on Windows), audio output (PortAudio/WASAPI), speech
# recognition, and the optional online song lookup (Shazam, YouTube).
app = ["fastapi>=0.110", "uvicorn>=0.29", "sounddevice>=0.5", "pywebview>=5.0; sys_platform == 'win32' or sys_platform == 'darwin'",
       "faster-whisper>=1.0", "yt-dlp[default]>=2025.10", "shazamio>=0.7", "deno>=2.0"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
concert-remaster = "concert_remaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concert_remaster = ["gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
