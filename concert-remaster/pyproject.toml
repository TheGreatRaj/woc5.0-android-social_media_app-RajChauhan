[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concert-remaster"
version = "0.1.0"
description = "Turn live concert recordings into clean, studio-style masters with on-device AI stem separation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.13",
    "soxr>=0.3",
    "librosa>=0.10",
    "pedalboard>=0.9",
    "pyloudnorm>=0.1.1",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# AI separation models (Roformer, MDX-Net, Demucs) run locally through audio-separator.
# Pick the CPU or GPU build; GPU gives 5-20x faster separation.
cpu = ["audio-separator[cpu]>=0.30"]
gpu = ["audio-separator[gpu]>=0.30"]
dev = ["pytest>=7"]

[project.scripts]
concert-remaster = "concert_remaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
